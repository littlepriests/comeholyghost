baseURL = "http://localhost:1313/"
theme = "risotto"
title = "personal-development"
locale = "en-us"
DefaultContentLanguage = "en"
enableInlineShortcodes = true

[privacy.x]
disable = true

# Automatically add content sections to main menu
sectionPagesMenu = "main"

[pagination]
pagerSize = 3

[params]
noindex = true

[params.theme]
palette = "base16-dark"

[params.about]
title = "personal-development"
description = "Notes and experiments in personal development."
logo = "🍚"

[[params.socialLinks]]
icon = "fa-brands fa-github"
title = "GitHub"
url = "https://github.com/"

[menu]

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = true
