baseURL = "http://localhost:1313/"
theme = "risotto"
title = "꒰ঌᐢ.ˬ.ᐢ໒꒱"
locale = "en-us"
DefaultContentLanguage = "en"
enableInlineShortcodes = true

[privacy.x]
disable = true

# Automatically add content sections to main menu
sectionPagesMenu = "main"

[pagination]
pagerSize = 3

[params]
noindex = true

[params.theme]
palette = "base16-dark"

[params.about]
title = ""
description = ""
logo = ""

# Custom cursor. Delete image, or point it at a missing file, to use the normal pointer.
# x and y are the click point, in pixels from the top left of the image. Keep the image at 32×32.
[params.cursor]
image = "images/cursor.gif"
x = 0
y = 0

# Homepage banner. Swap the file, or point banner at a different path under static/.
[params.home]
banner = "images/banner.png"
bannerAlt = "Site banner"
# Animated home button in the nav (sprite id from [[params.sprites]]). Empty = title chip.
logoSprite = "misdreavus"

# Sprite-strip animations (shortcode: {{</* sprite "id" */>}}).
# Refresh with scripts/slice-misdreavus.mjs / slice-kagura.mjs.
[[params.sprites]]
id = "misdreavus"
src = "images/sprites/misdreavus.png"
frameWidth = 50
frameHeight = 100
frames = 10
fps = 8
alt = "Misdreavus"

[[params.sprites]]
id = "kagura-walk"
src = "images/sprites/kagura-walk.png"
frameWidth = 25
frameHeight = 42
frames = 6
fps = 4
alt = "Kagura walk"

[[params.sprites]]
id = "kagura-down"
src = "images/sprites/kagura-down.png"
frameWidth = 40
frameHeight = 41
frames = 8
fps = 5
alt = "Kagura down"

[[params.sprites]]
id = "kagura-attack"
src = "images/sprites/kagura-attack.png"
frameWidth = 33
frameHeight = 45
frames = 8
fps = 5
alt = "Kagura attack"

# One picture per corner, fixed behind the page. Panels cover them.
# Leave image blank ("") to keep that corner empty. A missing file does the same.
# x and y are the distance from that corner. maxwidth and maxheight cap the picture;
# a smaller file stays at its own size.
[params.backdrop.bottom-right]
image = "images/backdrop-bottom-right.png"
alt = ""
x = "-9.5rem"
y = "0rem"
maxwidth = "24rem"
maxheight = "24rem"

# [params.backdrop.bottom-left]
# image = "images/backdrop-bottom-left.png"
# alt = ""
# x = "1.5rem"
# y = "1.5rem"
# maxwidth = "24rem"
# maxheight = "24rem"

[params.backdrop.top-right]
image = "images/backdrop-top-right.png"
alt = ""
x = "1.5rem"
y = "1.5rem"
maxwidth = "24rem"
maxheight = "24rem"

# [params.backdrop.top-left]
# image = "images/backdrop-top-left.png"
# alt = ""
# x = "1.5rem"
# y = "1.5rem"
# maxwidth = "24rem"
# maxheight = "24rem"

# Optional homepage footer items, under the visitor counter. Repeat a block to add more.
# kind is "text", "image", or "button". For an image, url is optional.
# A button uses title and url. icon is optional (a Font Awesome or Academicons class).
# [[params.home.footer]]
# kind = "text"
# text = "A line of footer text."
# [[params.home.footer]]
# kind = "image"
# src = "images/badge.png"
# alt = "Badge"
# url = "/about/"
# [[params.home.footer]]
# kind = "button"
# title = "GitHub"
# url = "https://github.com/"
# icon = "fa-brands fa-github"

[menu]

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 5

  [[menu.main]]
    identifier = "gallery"
    name = "Gallery"
    url = "/gallery/"
    weight = 6

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20

  [[menu.main]]
    identifier = "guestbook"
    name = "Guestbook"
    url = "/guestbook/"
    weight = 10

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = true
