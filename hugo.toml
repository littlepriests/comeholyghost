baseURL = "http://localhost:1313/"
theme = "risotto"
# Browser tab (+ default <title> elsewhere). Not the homepage banner header.
title = "꒰ঌᐢ.ˬ.ᐢ໒꒱"
locale = "en-us"
DefaultContentLanguage = "en"
enableInlineShortcodes = true

[privacy.x]
disable = true

# Automatically add content sections to main menu
sectionPagesMenu = "main"

[pagination]
pagerSize = 3

[params]
noindex = true

[params.theme]
palette = "base16-dark"

[params.about]
title = ""
description = ""
logo = ""

# Custom cursor. Delete image, or point it at a missing file, to use the normal pointer.
# x and y are the click point, in pixels from the top left of the image. Keep the image at 32×32.
[params.cursor]
image = "images/cursor.gif"
x = 0
y = 0

# Homepage banner + title. Banner picks a random image from bannerDir on each build/refresh.
[params.home]
# Folder under static/ with banner-sized images (png/jpg/webp/gif). Falls back to `banner` if empty.
bannerDir = "images/banners"
banner = "images/banner.png"
bannerAlt = "Site banner"
# Text under the banner only (.home-site-title). Independent of the tab `title` above.
displayTitle = "notes from cornfields"
# Font stack for that element only.
titleFont = "\"FF Dot Matrix\", \"Courier New\", monospace"
# Loads @font-face from static/css/home-title-font.css (put the font in static/fonts/).
titleFontUrl = "css/home-title-font.css"
# Optional title colors (.home-site-title). Empty = CSS defaults in home.css.
titleColor = ""
titleHighlight = ""
# Animated home button in the nav (sprite id from [[params.sprites]]). Empty = title chip.
logoSprite = "misdreavus"

# Sprite-strip animations (shortcode: {{</* sprite "id" */>}}).
# Refresh with scripts/slice-misdreavus.mjs / slice-kagura.mjs / slice-sango.mjs / slice-skifree.mjs.
[[params.sprites]]
id = "misdreavus"
src = "images/sprites/misdreavus.png"
frameWidth = 50
frameHeight = 100
frames = 10
fps = 8
alt = "Misdreavus"

[[params.sprites]]
id = "kagura-walk"
src = "images/sprites/kagura-walk.png"
frameWidth = 25
frameHeight = 42
frames = 6
fps = 4
alt = "Kagura walk"

[[params.sprites]]
id = "kagura-down"
src = "images/sprites/kagura-down.png"
frameWidth = 40
frameHeight = 41
frames = 8
fps = 5
alt = "Kagura down"

[[params.sprites]]
id = "kagura-attack"
src = "images/sprites/kagura-attack.png"
frameWidth = 33
frameHeight = 45
frames = 8
fps = 5
alt = "Kagura attack"

[[params.sprites]]
id = "sango-idle"
src = "images/sprites/sango-idle.png"
frameWidth = 27
frameHeight = 40
frames = 3
fps = 4
alt = "Sango idle"

[[params.sprites]]
id = "sango-walk"
src = "images/sprites/sango-walk.png"
frameWidth = 27
frameHeight = 42
frames = 4
fps = 6
alt = "Sango walk"

[[params.sprites]]
id = "sango-hurt"
