baseURL = "http://localhost:1313/"
# Browser tab (+ default <title> elsewhere). Not the homepage banner header.
title = "꒰ঌᐢ.ˬ.ᐢ໒꒱"
locale = "en-us"
DefaultContentLanguage = "en"
enableInlineShortcodes = true

# Netlify sets CONTEXT (production | deploy-preview | branch-deploy). head.html
# reads it so preview skips metered APIs. Hugo only allows getenv for listed names.
[security.funcs]
  getenv = ['^HUGO_', '^CI$', '^CONTEXT$']

[privacy.x]
disable = true

# Automatically add content sections to main menu
sectionPagesMenu = "main"

[pagination]
pagerSize = 3

[params]
noindex = true

[params.theme]
palette = "base16-dark"

# Site chrome vs blog-article faces. Self-host extra files under static/fonts/ +
# optional articleFontUrl — do not add Google Fonts / company CDNs.
# Knobs documented in docs/resources.md (Fonts).
[params.fonts]
site = "\"Fira Mono\", ui-monospace, monospace"
article = "\"Montserrat\", sans-serif"
articleFontUrl = "css/article-font.css"

[params.about]
title = ""
description = ""
logo = ""
# Public contact (read-me aside CTA). mailto only — nothing secret.
email = "fellbeasts@proton.me"

# Custom cursor. Delete image, or point it at a missing file, to use the normal pointer.
# x and y are the click point, in pixels from the top left of the image. Keep the image at 32×32.
[params.cursor]
image = "images/cursor.gif"
x = 0
y = 0

# Homepage banner + title. Hugo shuffles bannerDir and preloads one image per render.
[params.player]
# Remote playlist.json (HTTP URL with CORS). Empty or unreachable falls back to static/audio/playlist.json.
playlist = "https://administrator-corporation-syntax-page.trycloudflare.com/playlist.json"

[params.home]
# Folder under static/ with banner-sized images (png/jpg/webp/gif). Falls back to `banner` if empty.
bannerDir = "images/banners"
banner = "images/banner.webp"
bannerAlt = "Site banner"
# Text under the banner only (.home-site-title). Independent of the tab `title` above.
displayTitle = "welcome to the "
displayTitleLine2 = "FIELD🌽"
# Font stack for that element only.
titleFont = "Impact, sans-serif"
titleFontLine2 = "\"DotMatrixNarrow\", \"Courier New\", monospace"
# Loads @font-face from static/css/home-title-font.css (put the font in static/fonts/).
titleFontUrl = "css/home-title-font.css"
# Optional title colors (.home-site-title). Empty = CSS defaults in home.css.
titleColor = "yellow"
titleHighlight = "shadow-grey"
# Animated home button in the nav (sprite id from [[params.sprites]]). Empty = title chip.
logoSprite = "misdreavus"

# Sprite-strip animations (shortcode: {{</* sprite "id" */>}}).
# Refresh with scripts/slice-misdreavus.mjs / slice-kagura.mjs / slice-sango.mjs / slice-skifree.mjs / slice-grundo.mjs.
[[params.sprites]]
id = "misdreavus"
src = "images/sprites/misdreavus.png"
frameWidth = 50
frameHeight = 100
frames = 10
fps = 8
alt = "Misdreavus"

[[params.sprites]]
id = "kagura-walk"
src = "images/sprites/kagura-walk.png"
frameWidth = 25
frameHeight = 42
frames = 6
fps = 4
alt = "Kagura walk"

[[params.sprites]]
id = "kagura-down"
src = "images/sprites/kagura-down.png"
frameWidth = 40
frameHeight = 41
frames = 8
fps = 5
alt = "Kagura down"

[[params.sprites]]
id = "kagura-attack"
src = "images/sprites/kagura-attack.png"
frameWidth = 33
frameHeight = 45
frames = 8
fps = 5
alt = "Kagura attack"

[[params.sprites]]
id = "sango-idle"
src = "images/sprites/sango-idle.png"
frameWidth = 27
frameHeight = 40
frames = 3
fps = 4
alt = "Sango idle"

[[params.sprites]]
id = "sango-boomerang"
src = "images/sprites/sango-boomerang.png"
frameWidth = 45
frameHeight = 40
frames = 4
fps = 10
alt = "Hiraikotsu"

[[params.sprites]]
id = "sango-attack"
src = "images/sprites/sango-attack.png"
frameWidth = 48
frameHeight = 47
frames = 8
fps = 8
alt = "Sango attack"

[[params.sprites]]
id = "skifree-yeti"
src = "images/sprites/skifree-yeti.png"
frameWidth = 32
frameHeight = 43
frames = 9
fps = 3
alt = "SkiFree yeti"

[[params.sprites]]
id = "grundo-idle"
src = "images/sprites/grundo-idle.png"
frameWidth = 42
frameHeight = 56
frames = 1
fps = 1
alt = "Orange Grundo idle"

[[params.sprites]]
id = "grundo-kick"
src = "images/sprites/grundo-kick.png"
frameWidth = 46
frameHeight = 56
frames = 3
fps = 8
alt = "Orange Grundo kick"

# One picture per corner, fixed behind the page. Panels cover them.
# Leave image blank ("") to keep that corner empty. A missing file does the same.
# x and y are the distance from that corner. maxwidth and maxheight cap the picture;
# a smaller file stays at its own size.
[params.backdrop.bottom-right]
image = "images/backdrop-bottom-right.webp"
alt = ""
# Used by layouts/partials/sword-figure.html on read-me (not a fixed home corner).
# x/y/max* only matter if this corner is ever emitted as .site-backdrop.
x = "0.75rem"
y = "0rem"
maxwidth = "16rem"
maxheight = "20rem"

# [params.backdrop.bottom-left]
# image = "images/backdrop-bottom-left.png"
# alt = ""
# x = "1.5rem"
# y = "1.5rem"
# maxwidth = "24rem"
# maxheight = "24rem"

[params.backdrop.top-right]
image = "images/backdrop-top-right.png"
alt = ""
x = "1.5rem"
y = "1.5rem"
maxwidth = "24rem"
maxheight = "24rem"

# [params.backdrop.top-left]
# image = "images/backdrop-top-left.png"
# alt = ""
# x = "1.5rem"
# y = "1.5rem"
# maxwidth = "24rem"
# maxheight = "24rem"

# Optional homepage footer items, under the visitor counter. Repeat a block to add more.
# kind is "text", "image", or "button". For an image, url is optional.
# A button uses title and url. icon is optional (a Font Awesome or Academicons class).
# [[params.home.footer]]
# kind = "text"
# text = "A line of footer text."
# [[params.home.footer]]
# kind = "image"
# src = "images/badge.png"
# alt = "Badge"
# url = "/about/"
# [[params.home.footer]]
# kind = "button"
# title = "GitHub"
# url = "https://github.com/"
# icon = "fa-brands fa-github"

# Newsletter (Resend). Form opens from nav + SkiFree yeti; API key stays in Netlify env.
# yetiIcon: word (DotMatrix “subscribe”, scroll-reveal) | plane | bell | rss | at
# yetiIconPos: bottom | top | left | right
[params.subscribe]
yetiIcon = "word"
yetiIconPos = "right"

[menu]

  # Single wrapping row (Misdreavus + links). Order = weight.
  [[menu.main]]
    identifier = "blog"
    name = "writing"
    url = "/blog/"
    weight = 5

  [[menu.main]]
    identifier = "gallery"
    name = "photobook"
    url = "/gallery/"
    weight = 6

  [[menu.main]]
    identifier = "guestbook"
    name = "guestbook"
    url = "/guestbook/"
    weight = 10

  [[menu.main]]
    identifier = "read-me"
    name = "read-me.txt"
    url = "/read-me/"
    weight = 11

# Article photos live in the post folder. Publish only the resized files
# templates ask for, not the master next to index.md.
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = "/blog/**"

[taxonomies]
category = "categories"
tag = "tags"
series = "series"

[markup.goldmark.renderer]
unsafe = true

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = true
