{{ define "main" }}
    {{- if eq .Section "blog" }}
    {{- partial "css.html" "article-reading" }}
    {{- end }}
    {{- if .Params.sword_figure -}}
    {{- partial "sword-figure.html" . -}}
    {{- end -}}
    <header class="content__header">
        <h1>{{ .Title | markdownify }}</h1>
    </header>
    <div class="content__body">
        {{ .Content }}
        {{- partial "page-buttons.html" . -}}
    </div>
{{ end }}
