<!DOCTYPE html>
<html lang="{{- site.Language.Lang -}}">
<head>
    {{- partial "head.html" . -}}
    <link rel="stylesheet" href="{{ "css/guestbook.css" | relURL }}?v=4">
</head>
<body class="guestbook-page">
    <div id="page-root">
    <div class="guestbook-wrap">
        <header class="guestbook-header">
            {{- partial "header.html" . -}}
        </header>

        <main>
            <h1>{{ .Title }}</h1>
            <div class="guestbook-intro">{{ .Content }}</div>
            {{- partial "page-buttons.html" . -}}

            <form class="guestbook__form" data-guestbook-form>
                <label>name
                    <input type="text" name="name" maxlength="80" autocomplete="nickname">
                </label>
                <label>say anything...
                    <textarea name="message" maxlength="500" rows="4"></textarea>
                </label>
                <label class="guestbook__hp" aria-hidden="true">Leave blank
                    <input type="text" name="website" tabindex="-1" autocomplete="off">
                </label>
                <p class="guestbook__error" data-guestbook-error hidden></p>
                <p class="guestbook__status" data-guestbook-status hidden></p>
                <button type="submit">≽(◉˕ ◉ ≼マ</button>
            </form>

            <section aria-label="Guestbook entries">
                <h2>beautiful angels ˚₊‧꒰ა ♡ ໒꒱ ‧₊˚</h2>
                <ol class="guestbook__entries" data-guestbook-list></ol>
            </section>
        </main>
    </div>
            <script src="{{ "js/guestbook.js" | relURL }}?v=2"></script>
    </div>
    {{ partial "stars.html" . }}
    {{ partial "backdrop.html" . }}
    {{ partial "player.html" . }}
    {{ partial "subscribe-dialog.html" . }}
    <script src="{{ "js/site-tips.js" | relURL }}?v=2"></script>
    <script src="{{ "js/subscribe.js" | relURL }}?v=4"></script>
</body>
</html>
