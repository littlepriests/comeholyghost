{{- $id := .Get 0 | default (.Get "id") -}}
{{- $scale := .Get "scale" | default "" -}}
{{- with partial "sprite-by-id.html" $id -}}
  {{- partial "sprite.html" (merge . (dict "alt" (.alt | default .id) "scale" ($scale | default .scale))) -}}
{{- else -}}
<span class="sprite-anim sprite-anim--missing">{{ $id }}</span>
{{- end -}}
