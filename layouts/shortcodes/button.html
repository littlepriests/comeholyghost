<link rel="stylesheet" href="{{ "css/buttons.css" | relURL }}?v=3">
{{- $text := .Get "text" -}}
{{- $url := .Get "url" -}}
{{- $icon := .Get "icon" | default "" -}}
{{- $name := "" -}}
{{- if $icon }}{{ $name = partial "icon-name.html" $icon }}{{ end -}}
<a class="site-button" href="{{ $url | safeURL }}">{{- with $name }}{{ partial "icon.html" (dict "name" .) }} {{ end -}}{{ $text }}</a>
