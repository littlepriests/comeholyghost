{{ define "main" }}
    <link rel="stylesheet" href="{{ "css/blog-index.css" | relURL }}?v=9">
    <link rel="stylesheet" href="{{ "css/article-media.css" | relURL }}?v=6">
    <div class="blog-index">
        <h1 class="blog-index__heading" id="{{ .Title | urlize }}">{{ .Title | markdownify }}</h1>

        {{ .Content }}
        {{- partial "page-buttons.html" . -}}

        {{ with .Pages }}
        <div class="blog-index__feed">
            {{ range . }}
                {{ partial "blog-entry.html" . }}
            {{ end }}
        </div>
        {{ end }}
    </div>
{{ end }}

{{ define "aside" }}
    {{ if .Params.description }}<p>{{ .Params.description }}</p>{{ end }}
{{ end }}
