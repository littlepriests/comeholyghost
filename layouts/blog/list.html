{{ define "main" }}
    {{- partial "css.html" "blog-index" }}
    <div class="blog-index">
        <h1 class="blog-index__heading" id="{{ .Title | urlize }}">{{ .Title | markdownify }}</h1>

        {{ .Content }}
        {{- partial "page-buttons.html" . -}}

        {{ with .Pages }}
        <div class="blog-index__feed">
            {{ range . }}
                {{ partial "blog-entry.html" . }}
            {{ end }}
        </div>
        {{ end }}
    </div>
{{ end }}
