{{ define "main" }}
    <h1 id="{{ .Title | urlize }}">{{ .Title | markdownify }}</h1>

    {{ .Content }}
    {{- partial "page-buttons.html" . -}}

    {{ with .Pages }}
    <ul>
    {{ range . }}
        {{ .Render "li" }}
    {{ end }}
    </ul>
    {{ end }}
{{ end }}

{{ define "aside" }}
    {{ if .Params.description }}<p>{{ .Params.description }}</p>{{ end }}
{{ end }}
