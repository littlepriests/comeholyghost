{{ with .Params.buttons }}
<p class="site-buttons">
    {{ range . }}
    {{- $name := "" -}}
    {{- with .icon }}{{ $name = partial "icon-name.html" . }}{{ end -}}
    <a class="site-button" href="{{ .url | safeURL }}">{{- with $name }}{{ partial "icon.html" (dict "name" .) }} {{ end -}}{{ .title }}</a>
    {{ end }}
</p>
{{ end }}
