{{/*
  Star trail (homepage only — see layouts/index.html).
  Self-hosted pin: static/js/vendor/cursor-effects.esm.js (v1.0.18 motion,
  star particles instead of bubbles). Skip on coarse / narrow / reduced motion.
*/}}
<script type="module">
    import { starCursor } from "{{ "js/vendor/cursor-effects.esm.js" | relURL }}";

    var trail = null;
    var overSword = false;
    var mqReduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    var mqNarrow = window.matchMedia("(max-width: 44.99rem)");
    var mqCoarse = window.matchMedia("(pointer: coarse)");

    function allowed() {
        return !mqReduce.matches && !mqNarrow.matches && !mqCoarse.matches;
    }

    function startTrail() {
        if (trail || overSword || !allowed()) return;
        trail = starCursor({
            colors: ["#d4b85c", "#e6d48a", "#c9a84a", "#f0e6b8"]
        });
    }

    function stopTrail() {
        if (!trail) return;
        if (typeof trail.destroy === "function") trail.destroy();
        trail = null;
    }

    function sync() {
        if (allowed()) startTrail();
        else stopTrail();
    }

    function isSword(node) {
        return !!(node && node.closest && node.closest(".sword-figure"));
    }

    document.addEventListener("pointerover", function (event) {
        if (!isSword(event.target)) return;
        overSword = true;
        stopTrail();
    }, true);

    document.addEventListener("pointerout", function (event) {
        if (!isSword(event.target)) return;
        if (isSword(event.relatedTarget)) return;
        overSword = false;
        sync();
    }, true);

    mqReduce.addEventListener("change", sync);
    mqNarrow.addEventListener("change", sync);
    mqCoarse.addEventListener("change", sync);
    sync();
</script>
