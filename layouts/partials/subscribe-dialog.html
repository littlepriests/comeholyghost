{{- /*
  Sitewide subscribe dialog (outside #page-root so SPA nav keeps it).
  Opened by [data-subscribe-open] — nav + SkiFree yeti.
*/ -}}
<dialog class="subscribe-dialog" id="subscribe-dialog" data-subscribe-dialog aria-labelledby="subscribe-dialog-title">
  <form class="subscribe-dialog__form" data-subscribe-form method="dialog">
    <div class="subscribe-dialog__head">
      <h2 id="subscribe-dialog-title" class="subscribe-dialog__title">{{ hugo.Data.chrome.subscribe.title }}</h2>
      <button type="submit" class="subscribe-dialog__close" value="cancel" formnovalidate aria-label="close">{{ hugo.Data.chrome.subscribe.close }}</button>
    </div>
    <p class="subscribe-dialog__lede">{{ hugo.Data.chrome.subscribe.lede }}</p>
    <label class="subscribe-dialog__label">{{ hugo.Data.chrome.subscribe.email_label }}
      <input type="email" name="email" required autocomplete="email" maxlength="200" placeholder="{{ hugo.Data.chrome.subscribe.email_placeholder }}">
    </label>
    <label class="site-hp" aria-hidden="true">Leave blank
      <input type="text" name="website" tabindex="-1" autocomplete="off">
    </label>
    <p class="subscribe-dialog__error" data-subscribe-error hidden></p>
    <p class="subscribe-dialog__ok" data-subscribe-ok hidden></p>
    <div class="subscribe-dialog__actions">
      <button type="button" class="subscribe-dialog__submit" data-subscribe-submit>{{ hugo.Data.chrome.subscribe.submit }}</button>
      <button type="submit" class="subscribe-dialog__cancel" value="cancel" formnovalidate>{{ hugo.Data.chrome.subscribe.cancel }}</button>
    </div>
  </form>
</dialog>
