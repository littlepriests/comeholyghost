# Unit + browser behavior tests (`corn test`). corn deploy waits for this check.
# Screenshot tests (@visual) stay local: font rendering differs between
# Windows and the Linux runner, so their baselines would never match here.
name: Tests

on:
  pull_request:
  push:
    branches: [preview, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.167.0"
          extended: true

      - name: Install deps
        run: |
          npm ci --prefix scripts
          npm ci --prefix tests
          cd tests && npx playwright install --with-deps chromium

      - name: Unit tests
        working-directory: tests
        run: npm run unit

      - name: Browser behavior tests
        working-directory: tests
        run: npm run e2e

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/test-results/
          retention-days: 7
