# Prose lint for content/ (same folder as `corn edit`). House-style lowercase
# still trips Vale.Spelling, so this check annotates but does not fail the job.
name: Vale

on:
  pull_request:
  push:
    branches: [preview, main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vale
        uses: vale-cli/vale-action@v2.1.1
        with:
          files: content
          sync: true
          # Only lines touched in the PR (full tree is noisy on existing posts).
          filter_mode: added
          reporter: github-pr-check
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
