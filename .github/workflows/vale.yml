# Prose lint for content/. Same Vocab as corn edit (Site + Batch).
# Annotations stay non-blocking. Job fails only on a real misspelling in an
# added line that is not on Site/Batch accept (corn edit `p` / `a`).
# A case change (illinois / Illinois) is not a misspelling.
name: Vale

on:
  pull_request:
  push:
    branches: [preview, main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vale
        # Annotations only. Style rules and house lowercase must not fail the job.
        uses: vale-cli/vale-action@v3
        with:
          files: content
          config: vale.ini
          sync: true
          # Only lines touched in the PR (full tree is noisy on existing posts).
          filter_mode: added
          reporter: github-pr-check
          fail_on_error: false
          fail_level: none
          level: warning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on misspellings
        env:
          VALE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/vale-typos.mjs --base "$VALE_BASE"
