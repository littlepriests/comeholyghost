# Hand-tuned spill paths for the back-to-top stomp (player.css .is-stomp).
# bright: true adds the is-bright class (extra glow).
# dx/dx2: horizontal start/end drift; lift: initial rise; fall: total drop.
# hd: animation delay; hspurt: animation duration; rot: rotation at peak.
# Units are CSS values — keep them quoted to avoid YAML type coercion.
- bright: true
  dx: "0rem"
  lift: "-1.6rem"
  dx2: "0.2rem"
  fall: "4.8rem"
  hd: "0s"
  hspurt: "1.55s"
  rot: "4deg"
