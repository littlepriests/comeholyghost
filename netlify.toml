[build]
  # Pin the public host so baked absolute URLs (og, feeds) match the custom domain.
  # Nav/home links use relative URLs so a wrong primary domain cannot yank visitors to *.netlify.app.
  command = "hugo --minify --baseURL https://cornfieldjournal.com/"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  HUGO_VERSION = "0.167.0"
  HUGO_ENABLEGITINFO = "true"
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "hugo --minify --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --minify --baseURL $DEPLOY_PRIME_URL"

# Long-cache versioned/static assets; HTML revalidates so deploys show up.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/skins/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
