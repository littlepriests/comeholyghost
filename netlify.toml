[build]
  # Pin the public host so baked absolute URLs (og, feeds) match the custom domain.
  # Nav/home links use relative URLs so a wrong primary domain cannot yank visitors to *.netlify.app.
  # newsletter-on-deploy no-ops unless NEWSLETTER_AUTO_SEND=1 (+ Resend env vars).
  command = "hugo --minify --baseURL https://cornfieldjournal.com/ && node scripts/newsletter-on-deploy.mjs"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  HUGO_VERSION = "0.167.0"
  HUGO_ENABLEGITINFO = "true"
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "hugo --minify --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy]
  command = "hugo --minify --baseURL $DEPLOY_PRIME_URL"

